services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agriguard:agriguard@db:5432/agriguard
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: agriguard
      POSTGRES_USER: agriguard
      POSTGRES_PASSWORD: agriguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

